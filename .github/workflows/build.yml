name: Build PS4 13.52 PKG

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Compiler
        run: |
          sudo ln -sf $(which clang) /usr/local/bin/clang-10
          sudo ln -sf $(which ld.lld) /usr/local/bin/ld.lld-10

      - name: Setup OpenOrbis Toolchain
        run: |
          curl -sSL -o toolchain.tar.gz https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain/releases/download/v0.5.4/toolchain-llvm-18.tar.gz
          sudo mkdir -p /opt/OpenOrbis
          sudo tar -xzf toolchain.tar.gz -C /opt/OpenOrbis
          
          TC_ROOT="/opt/OpenOrbis/OpenOrbis/PS4Toolchain"
          sudo chmod -R +x "$TC_ROOT/bin"
          
          # Makefile'ın aradığı bin/linux klasörünü bağla
          sudo mkdir -p "$TC_ROOT/bin/linux"
          sudo cp -rf "$TC_ROOT/bin/"* "$TC_ROOT/bin/linux/" 2>/dev/null || true
          
          # PRX modüllerini bağla
          sudo mkdir -p "$TC_ROOT/src/modules"
          sudo find "$TC_ROOT" -name "*.prx" -exec cp -f {} "$TC_ROOT/src/modules/" \; || true
          
          echo "OO_PS4_TOOLCHAIN=$TC_ROOT" >> $GITHUB_ENV
          echo "PATH=$PATH:$TC_ROOT/bin:$TC_ROOT/bin/linux" >> $GITHUB_ENV

      - name: Build PKG
        run: |
          export DOTNET_SYSTEM_GLOBALIZATION_INVARIANT=1
          make CC=clang LD=ld.lld

      - name: Upload PKG as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiny-ps4-shell-13.52-pkg
          path: "*.pkg"
